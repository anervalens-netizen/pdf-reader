name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag-ul release-ului (ex: v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    name: Windows - instalator NSIS
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verificare tipuri si export
        run: |
          npm run typecheck
          npm run test:export
          npm run test:sw

      - name: Build instalator
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: pdf-windows
          if-no-files-found: error
          path: |
            release/PDF-Setup-*.exe
            release/PDF-Setup-*.exe.blockmap
            release/latest.yml

  linux:
    name: Linux - AppImage + deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependențe pentru pachetul deb
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg

      - run: npm ci

      - name: Verificare tipuri si export
        run: |
          npm run typecheck
          npm run test:export
          npm run test:sw

      - name: Build pachete
        run: npm run dist:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: pdf-linux
          if-no-files-found: error
          path: |
            release/PDF-*.AppImage
            release/PDF-*.deb

  android:
    name: Android - APK
    runs-on: ubuntu-latest
    env:
      # Secretele nu pot fi folosite direct în condiții `if:`; sunt expuse
      # ca variabile de mediu, iar pasul verifică dacă cheia există.
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Acceptă licențele Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" > /dev/null || true

      - name: Verificare tipuri si export
        run: |
          npm run typecheck
          npm run test:export
          npm run test:sw

      - name: Build web + sincronizează shell-ul Android
        run: |
          npm run build:web
          npx cap sync android

      - name: Build APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: pdf-android
          if-no-files-found: error
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Varianta semnată se construiește doar dacă există cheia în secrets.
      - name: Build APK semnat (release)
        working-directory: android
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Fără cheie de semnare (ANDROID_KEYSTORE_BASE64) - se sare varianta de release."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.storeFile=keystore.jks \
            -Pandroid.injected.signing.storePassword="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.keyAlias="$KEY_ALIAS" \
            -Pandroid.injected.signing.keyPassword="$KEYSTORE_PASSWORD"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-android-release
          if-no-files-found: ignore
          path: android/app/build/outputs/apk/release/app-release.apk

  release:
    name: Publică release-ul
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pdf-windows
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          name: pdf-linux
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          name: pdf-android
          path: artifacts

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: pdf-android-release
          path: artifacts-release

      - name: Creează release-ul GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: PDF ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/PDF-Setup-*.exe
            artifacts/PDF-Setup-*.exe.blockmap
            artifacts/latest.yml
            artifacts/PDF-*.AppImage
            artifacts/PDF-*.deb
            artifacts/app-debug.apk
            artifacts-release/app-release.apk
