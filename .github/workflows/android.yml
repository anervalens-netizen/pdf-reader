name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Acceptă licențele Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" > /dev/null || true

      - name: Verificare tipuri si export
        run: |
          npm run typecheck
          npm run test:export
          npm run test:sw
          npm run test:pages

      - name: Build web + sincronizează shell-ul Android
        run: |
          npm run build:web
          npx cap sync android

      - name: Build APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: pdf-android-debug
          if-no-files-found: error
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build și verifică APK-ul release semnat
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        working-directory: android
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "Secretele de semnare Android lipsesc." >&2
            exit 1
          fi
          umask 077
          keystore="$RUNNER_TEMP/pdf-reader-signing.p12"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.storeFile="$keystore" \
            -Pandroid.injected.signing.storePassword="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.keyAlias="$KEY_ALIAS" \
            -Pandroid.injected.signing.keyPassword="$KEYSTORE_PASSWORD"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pdf-android-release-signed
          if-no-files-found: error
          path: android/app/build/outputs/apk/release/app-release.apk
