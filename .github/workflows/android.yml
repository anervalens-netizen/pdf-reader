name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Acceptă licențele Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" > /dev/null || true

      - name: Verificare tipuri si export
        run: |
          npm run typecheck
          npm run test:export
          npm run test:sw
          npm run test:pages

      - name: Build web + sincronizează shell-ul Android
        run: |
          npm run build:web
          npx cap sync android

      - name: Build APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: pdf-android-debug
          if-no-files-found: error
          path: android/app/build/outputs/apk/debug/app-debug.apk
