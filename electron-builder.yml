appId: com.pdf.reader
productName: PDF
copyright: Copyright © 2026 Andrei Stancu

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json

# Include third-party MIT notice in installed distributions, not just in GitHub.
extraResources:
  - from: LICENSE
    to: LICENSE
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: licenses/Folio-MIT.txt
    to: licenses/Folio-MIT.txt

asar: true
electronDownload:
  cache: .electron-cache

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
  artifactName: PDF-Setup-${version}.${ext}
  executableName: PDF

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PDF
  deleteAppDataOnUninstall: false
  # NSIS' Romanian translation is missing macros required by the multi-user
  # install mode, which electron-builder treats as a fatal warning.
  installerLanguages:
    - en_US

fileAssociations:
  - ext: pdf
    name: Document PDF
    description: Document PDF
    role: Editor
    icon: build/icon.png

linux:
  target:
    - AppImage
    - deb
  category: Office
  icon: build/icon.png
  artifactName: PDF-${version}-${arch}.${ext}
  # Keep the .desktop entry in sync with the executable name so the desktop
  # environment links the running window to the launcher icon.
  syncDesktopName: true

publish:
  provider: github
  owner: anervalens-netizen
  repo: pdf-reader
  releaseType: release
